[package]
name = "raid-realms"
version = "0.1.0"
description = "Raid Realms - Tactical 1v1 Deckbuilder Game"
authors = ["Lenny"]
edition = "2021"

[lib]
name = "raid_realms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
